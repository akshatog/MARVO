name: ORCA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (Python 3.10)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        env:
          ORCA_DATA_MODE: DEMO      # no live network calls in CI
          ORCA_USE_LLM: "0"         # skip Groq/Sarvam — needs API keys
        run: python -m pytest tests/ -q --tb=short

  # ── Frontend: build ──────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Confirm dist/index.html exists
        run: test -f dist/index.html && echo "Build OK" || (echo "Build MISSING" && exit 1)

  # ── Smoke test: health endpoint ───────────────────────────────────────────────
  health-check:
    name: API health smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server and probe /api/health
        env:
          ORCA_DATA_MODE: DEMO
          ORCA_USE_LLM: "0"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://localhost:8000/api/health && break
            echo "Waiting for server... ($i/30)"
          done
          HEALTH=$(curl -sf http://localhost:8000/api/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='ok', f'Bad status: {d}'"
          kill $SERVER_PID
