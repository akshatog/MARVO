# Optional combined deployment. Production split hosting uses render.backend.yaml.
services:
  - type: web
    name: marvo-marine
    branch: main
    runtime: docker
    # Render builds and runs the Dockerfile at repo root.
    # Stage 1: Node 20 builds the React frontend
    # Stage 2: Python 3.10-slim serves everything via FastAPI
    healthCheckPath: /api/health
    # Pass VITE_MAPBOX_TOKEN as a Docker build arg so Vite bakes it into
    # the frontend bundle at build time (it is not available at runtime).
    dockerBuildArgs:
      - key: VITE_MAPBOX_TOKEN
        secret: VITE_MAPBOX_TOKEN
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: MARVO_DATA_MODE
        value: LIVE
      - key: MARVO_USE_LLM
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOSDAC_USER
        sync: false
      - key: MOSDAC_PASS
        sync: false
