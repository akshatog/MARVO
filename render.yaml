services:
  - type: web
    name: marvo-marine
    runtime: docker
    # Render builds and runs the Dockerfile at repo root.
    # Stage 1: Node 20 builds the React frontend
    # Stage 2: Python 3.10-slim serves everything via FastAPI
    healthCheckPath: /api/health
    envVars:
      - key: MARVO_DATA_MODE
        value: LIVE
      - key: MARVO_USE_LLM
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOSDAC_USER
        sync: false
      - key: MOSDAC_PASS
        sync: false
